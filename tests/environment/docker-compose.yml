services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rasheepharma-test-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${TEST_SQL_PASSWORD:?Copy .env.example to .env and set TEST_SQL_PASSWORD}
    ports:
      - "127.0.0.1:14330:1433"
    networks:
      - test-network
    restart: "no"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: rasheepharma-test-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --debug /data/azurite.log --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    networks:
      - test-network
    restart: "no"

networks:
  test-network:
    name: rasheepharma-test-network

