name: Bulk upload worker build
on:
  push:
    branches:
      - feature/bulk-upload-worker
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore solution
        run: dotnet restore RashePharma.slnx
      - name: Build solution
        run: dotnet build RashePharma.slnx --no-restore --configuration Release
